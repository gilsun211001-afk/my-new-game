<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임창민 기획마을</title>
<meta name="description" content="게임 기획자 임창민의 포트폴리오. 조선 판타지 마을을 걸으며 기획서와 게임을 둘러보거나, 자기소개서 형식으로 한 번에 볼 수 있습니다.">
<meta name="theme-color" content="#07110e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230a8f64%22/%3E%3Ctext x=%228%22 y=%2212%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22%2304140e%22%3E%E6%9E%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="preload" href="assets/fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<!-- ═════════ GAME (기획마을) ═════════ -->
<div class="game" id="game" hidden>
  <canvas id="world" tabindex="0" aria-label="기획마을 지도. 방향키로 이동하고 Space로 대화합니다."></canvas>
  <div class="hud">
    <div class="hud-card quest"><div id="qText">마을 탐방 <b>0</b>/6</div><div class="bar"><i id="qBar"></i></div></div>
    <button class="hbtn" id="travelBtn" type="button" aria-label="장소 목록">☰ <span class="hide-sm">장소</span></button>
    <div class="hud-sp"></div>
    <button class="hbtn hide-sm" data-snd type="button">♪ 소리</button>
    <button class="hbtn" id="helpBtn" type="button" aria-label="조작법">?</button>
    <button class="hbtn em" id="toResume" type="button">📜 <span class="hide-sm">자기소개서로 보기</span></button>
  </div>
  <div class="travel" id="travel" hidden></div>
  <div class="minimap"><div class="lbl"><span>기획마을</span><span>● 방문</span></div><canvas id="mini" width="176" height="128"></canvas></div>
  <div class="prompt" id="prompt" hidden></div>
  <div class="pad" id="pad" aria-hidden="true"><i></i></div>
  <button class="act" id="act" type="button" aria-label="대화하기">대화</button>

  <div class="dlg" id="dlg" hidden role="dialog" aria-live="polite">
    <div class="face" id="dlgFace"><canvas width="96" height="96"></canvas></div>
    <div><div class="who" id="dlgWho"></div><p class="line" id="dlgLine"></p><div class="choices" id="dlgChoices"></div></div>
    <span class="more" id="dlgMore" hidden>▼</span>
  </div>
</div>

<!-- ═════════ TITLE ═════════ -->
<div class="title" id="title" hidden>
  <div class="title-inner">
    <div class="seal">林</div>
    <h1>임창민의 기획마을<small>GAME DESIGNER PORTFOLIO</small></h1>
    <p class="lede">조선 판타지 마을을 걸으며 주민들과 대화하면, 제 기획서와 게임이 하나씩 열립니다.</p>
    <div class="title-btns">
      <button class="tbtn primary" id="startGame" type="button"><span class="ico">▶</span><span>모험 시작<small>마을을 걸으며 둘러보기 · 약 5분</small></span></button>
      <button class="tbtn" id="startResume" type="button"><span class="ico">📜</span><span>자기소개서로 보기<small>한 페이지로 빠르게 읽기</small></span></button>
    </div>
    <p class="hint"><span class="blink">▶</span> 방향키 · WASD · 화면 탭으로 이동 &nbsp;|&nbsp; Space로 대화</p>
  </div>
</div>

<!-- ═════════ RESUME ═════════ -->
<div id="resume" hidden>
  <div class="doc">
    <aside class="rail">
      <div class="card profile">
        <div class="avatar"><canvas id="avatar" width="384" height="240" aria-label="픽셀 아트 자화상"></canvas><span class="tag">GAME DESIGNER</span></div>
        <div><h1 id="pfName">임창민</h1><p class="role" id="pfHead"></p></div>
        <dl class="facts" id="pfFacts"></dl>
        <div class="rail-actions">
          <button class="btn gm" id="toGame" type="button">▶ 게임으로 보기</button>
          <button class="btn" id="themeBtn" type="button" aria-label="밝기 전환">◐ 테마</button>
        </div>
      </div>
      <nav class="card toc" id="toc" aria-label="목차"></nav>
    </aside>
    <main class="main" id="chapters"></main>
    <div class="mnav"><label class="sr" for="mnav">목차</label><select id="mnav"></select><button class="btn" id="totop" type="button" aria-label="맨 위로">▲</button></div>
  </div>
  <div class="foot">© 2026 LIM CHANG MIN · 수치와 인용은 원본 기획 문서와 게임 코드를 기준으로 옮겼습니다 · <button class="btn gm" id="toGame2" type="button" style="padding:4px 10px">기획마을로 돌아가기</button> · <button class="btn" data-snd type="button" style="padding:4px 10px">♪</button></div>
</div>

<!-- ═════════ OVERLAYS ═════════ -->
<div class="scroll" id="scroll" hidden role="dialog" aria-modal="true" aria-labelledby="scrollPlace">
  <div class="scroll-box">
    <div class="scroll-head"><span class="place" id="scrollPlace"></span><button class="btn x" id="scrollClose" type="button">닫기 <span class="mono">Esc</span></button></div>
    <div class="scroll-body" id="scrollBody"></div>
  </div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="이미지 보기">
  <div class="lb-top"><span id="lbCap"></span><button class="hbtn x" id="lbClose" type="button">닫기 ✕</button></div>
  <div class="lb-stage" id="lbStage"><button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전">‹</button><img id="lbImg" alt=""><button class="lb-nav next" id="lbNext" type="button" aria-label="다음">›</button></div>
  <div class="lb-thumbs" id="lbThumbs"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/docs.js"></script>
<script src="assets/js/world.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
